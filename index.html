    THESIS: A counter tool the slowest user operates unaided — one obvious action
    per screen, money in both currencies at equal weight, saved always
    distinguishable from pending. Refuses the dense admin-dashboard default.
    OWN-WORLD: Cool paper ground, white cards, near-black ink, one deep
    money-green accent; Atkinson Hyperlegible Next; oversized tabular numerals
    for money; quiet chips for stock; five labeled tabs in a bottom bar.
    STORY: Staff types a name, reads the price in $ and Bs, taps Agregar, taps
    Cobrar; sees green confirmation or amber pending — never wonders.
    FIRST VIEWPORT: Phone — brand + day-rate header, big search field, product
    rows (name, dual price, stock chip, add), sticky total strip, bottom tabs.
    FORM: category standard played straight (standing exit after three
    re-rolls, steer "simple, elegant, minimal"); seed key b281572b.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
